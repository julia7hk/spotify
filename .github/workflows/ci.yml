name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels an in-flight run — no point building
# an image nobody will deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      # No secrets needed: tests/conftest.py seeds dummy Spotify credentials and
      # every test runs against captured fixtures, never the live API.
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `next build` is the de-facto check for this repo — it typechecks again
      # and fails on unresolved imports or bad JSX.
      - name: Build
        run: npm run build

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Dockerfile.backend expects the repo root as context.
          context: .
          file: ops/Dockerfile.backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/julia7hk/spotify/backend:latest
            ghcr.io/julia7hk/spotify/backend:${{ github.sha }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Note: `next build` inside this image fetches Plus Jakarta Sans and
      # JetBrains Mono from Google Fonts at build time (next/font/google).
      # Runners have open egress, so this is fine here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/julia7hk/spotify/frontend:latest
            ghcr.io/julia7hk/spotify/frontend:${{ github.sha }}

  # Deploy is deliberately manual. When both images are published, this prints
  # the exact commands to run on oc40, with the SHA tag for a pinned deploy.
  deploy-instructions:
    name: Deploy (manual)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-backend, build-frontend]
    steps:
      - name: Print deploy commands
        run: |
          {
            echo "### Images published :rocket:"
            echo ""
            echo '```'
            echo "ghcr.io/julia7hk/spotify/backend:${GITHUB_SHA}"
            echo "ghcr.io/julia7hk/spotify/frontend:${GITHUB_SHA}"
            echo '```'
            echo ""
            echo "Deploy on oc40:"
            echo '```bash'
            echo "ssh oc40"
            echo "cd ~/_proj/spotify/ops"
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo ""
            echo "Pin this exact commit instead of :latest:"
            echo '```bash'
            echo "MUSIC_TAG=${GITHUB_SHA} docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
