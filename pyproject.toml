[project]
name = "spotify-dashboard"
version = "0.1.0"
description = "Personal Spotify listening dashboard (Flask + Spotipy backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.2",
    "flask-cors>=6.0.2",
    "spotipy>=2.23.0",
    "python-dotenv>=1.2.2",
    "gunicorn>=26.0.0",
]

[dependency-groups]
# Dev-only. ops/Dockerfile.backend runs `uv sync --frozen --no-dev`, so pytest
# never ships in the production image.
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py lives at the repo root, not in a package, so put the root on sys.path.
pythonpath = ["."]
