# nginx server block for music.julia7hk.com
#
# This file is meant to be dropped into the EXISTING falconup nginx's conf.d/
# directory (falconup26/ops/nginx/conf.d/), which is already mounted into the
# falconup-nginx container. It shares that nginx's http context, so:
#   - the `map $http_upgrade $connection_upgrade { ... }` from falconup.conf is
#     reused here (do NOT redefine it — nginx errors on a duplicate map).
#   - `resolver` is declared inside the server block (falconup.conf declares one
#     at http level; a second http-level resolver would be a duplicate).
#
# Requires the falconup-nginx container to be joined to the `edge` docker network
# so it can resolve music-backend / music-frontend by name. See ops/DEPLOY.md.

server {
  listen 80;
  server_name music.julia7hk.com;

  access_log /var/log/nginx/music.access.log;
  error_log  /var/log/nginx/music.error.log;

  gzip on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_types text/css application/javascript image/svg+xml;

  # Re-resolve container IPs every 10s (Docker embedded DNS) so a redeploy that
  # changes a container's IP doesn't leave nginx 502-ing at the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Variable targets are required for the resolver above to take effect — a
  # literal-hostname proxy_pass is resolved once at config load.
  set $music_frontend "http://music-frontend:3000";
  set $music_backend  "http://music-backend:5001";

  # Flask backend: API, plus the OAuth callback and logout routes.
  location /api/ {
    proxy_pass $music_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare terminates TLS; nginx sees http:80. Hardcode https so the app
    # sets Secure cookies and builds correct URLs (TRUST_PROXY=true reads this).
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
  }

  location = /callback {
    proxy_pass $music_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /logout {
    proxy_pass $music_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Everything else: Next.js frontend.
  location / {
    proxy_pass $music_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;   # from falconup.conf's map
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
  }
}
